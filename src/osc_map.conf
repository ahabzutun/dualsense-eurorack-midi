# ===========================================================================
#  OpenMW  MIDI -> OSC  mapping.  Edit + save; applies within ~1s, no restart.
#  Format:  CHANNEL  TYPE  NUMBER  ADDRESS  [MODE]  [flags]
#    MODE: cc | toggle | gate | velocity | dsstick (DualSense eurorack sticks)
#    flags: invert  lo=N hi=N  dz=N
# ===========================================================================
host 192.168.2.2
port 9000
debug off

# --- channel 16 : iii grid faders ---
16  cc  51  /omw/fov
16  cc  52  /omw/bloom
16  cc  53  /omw/dist
16  cc  30  /omw/timeofday
16  cc  29  /omw/weather

# --- DualSense: '*' = ANY channel (its channel resets to 1 on restart and
#     shifts with SELECT/START, so pinning to a number is unreliable). Its CCs
#     don't overlap the grid's, so wildcard is safe. ---
*   cc  2   /omw/move     dsstick   # left stick up/down    -> walk fwd/back (add 'invert' if reversed)
*   cc  87  /omw/look_x   dsstick   # right stick left/right -> turn
*   cc  88  /omw/look_y   dsstick   # right stick up/down    -> look up/down
*   cc  7   /omw/speed              # L2 -> hyperspeed flight dash (analog throttle)
*   cc  10  /omw/bloom              # R2 -> bloom glow
*   cc  14  /omw/jump     gate      # X (cross)  -> jump
*   cc  15  /omw/godmode  toggle    # O (circle) -> god mode
*   cc  22  /omw/levitate gate      # triangle -> levitate (edge-toggled in OpenMW)
*   cc  23  /omw/teleport gate      # square     -> teleport
# NOTE: left-stick LEFT/RIGHT (strafe) is eaten by the DualSense firmware - not sent.
*   note 72  /omw/firstperson gate     # touchpad click -> toggle 1st/3rd person view
