; loglady: the Pi's link to Teletype (replaces the Pi's USB gadget + power/data splitter).
;   USB to Teletype: boot keyboard (interface 0) + CDC serial = grid (last interface, as Teletype needs)
;   UART to the Pi (Serial1, D6=TX D7=RX, 1 Mbaud): COBS frames, see src/main.cpp and the Pi side
;   ~/xiao-uart/loglady_teletype.py
;   pio run -e loglady_tt -t upload
[env:loglady_tt]
platform = atmelsam
board = seeed_xiao
framework = arduino
board_build.usb_product = loglady
build_flags =
    -D USE_TINYUSB
    -D SERIAL_BUFFER_SIZE=1024
    -D LINK_BAUD=1000000
    -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src
    -I$PROJECT_PACKAGES_DIR/framework-arduino-samd-seeed/libraries/Adafruit_TinyUSB_Arduino/src/arduino
    -Wl,-u,TinyUSB_Device_Init -Wl,-u,TinyUSB_Device_Task -Wl,-u,TinyUSB_Device_FlushCDC
lib_ldf_mode = deep+
