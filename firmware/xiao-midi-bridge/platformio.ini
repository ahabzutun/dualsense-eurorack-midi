; XIAO MIDI host-to-host bridge. Flash BOTH boards of a pair with the same env.
;   pio run -e xiao_ssp -t upload   -> Pi <-> Percussa SSP   (USB name "XIAO-SSP")
;   pio run -e xiao_tt  -t upload   -> Pi <-> i2c2midi/Teletype (USB name "XIAO-TT")
[env]
platform = atmelsam
board = seeed_xiao
framework = arduino
lib_deps =
    MIDIUSB

[env:xiao_ssp]
board_build.usb_product = XIAO-SSP
build_flags = -D UART_BAUD=250000

[env:xiao_tt]
board_build.usb_product = XIAO-TT
build_flags = -D UART_BAUD=250000

; Fallback for a marginal UART wire: flash BOTH TT boards with this env
[env:xiao_tt_115k]
board_build.usb_product = XIAO-TT
build_flags = -D UART_BAUD=115200

; Named UART-link boards (Pi hardware UART <-> this XIAO <-> USB host). Pi side: ~/xiao-uart/links.json
;   link 1 ttyAMA0 -> SSP          link 2 uart3 ttyAMA3 -> i2c2midi
;   link 3 uart4 ttyAMA4           link 4 uart5 ttyAMA5
[env:mysteryman]
board_build.usb_product = mysteryman
build_flags = -D UART_BAUD=250000

[env:jumpingman]
board_build.usb_product = jumpingman
build_flags = -D UART_BAUD=250000

[env:loglady]
board_build.usb_product = loglady
build_flags = -D UART_BAUD=250000

[env:nadine]
board_build.usb_product = nadine
build_flags = -D UART_BAUD=250000
