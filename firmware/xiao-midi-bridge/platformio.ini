; XIAO MIDI host-to-host bridge. Flash BOTH boards of a pair with the same env.
;   pio run -e xiao_ssp -t upload   -> Pi <-> Percussa SSP   (USB name "XIAO-SSP")
;   pio run -e xiao_tt  -t upload   -> Pi <-> i2c2midi/Teletype (USB name "XIAO-TT")
[env]
platform = atmelsam
board = seeed_xiao
framework = arduino
lib_deps =
    MIDIUSB

[env:xiao_ssp]
board_build.usb_product = XIAO-SSP
build_flags = -D UART_BAUD=250000

[env:xiao_tt]
board_build.usb_product = XIAO-TT
build_flags = -D UART_BAUD=250000
