# Teletype link via loglady (UART XIAO) instead of the USB gadget. Remove this file to go back.
[Unit]
After=loglady-teletype.service
Wants=loglady-teletype.service

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /home/ahab/dualsense-eurorack-midi/src/grid_macros.py --teletype /run/loglady/grid
ExecStartPost=
# Teletype only takes the grid when the Pi reads its first messages: replug loglady once we listen
ExecStartPost=/bin/sh -c "sleep 2; /usr/bin/python3 /home/ahab/xiao-uart/loglady_teletype.py --replug"
